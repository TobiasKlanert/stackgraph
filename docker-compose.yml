services:
  app:
    container_name: stackgraph
    image: ghcr.io/tobiasklanert/stackgraph:latest
    networks:
      - web
    restart: unless-stopped
    # Rotate what is still logged (startup, errors) instead of growing forever.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  web:
    external: true