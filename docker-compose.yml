services:
  app:
    # The deploy script writes IMAGE_TAG=sha-<commit> into a .env file next to
    # this file on the server, so it is always clear which build runs.
    # Without a .env, latest is used.
    image: ghcr.io/tobiasklanert/stackgraph:${IMAGE_TAG:-latest}
    container_name: stackgraph
    networks:
      - web
    restart: unless-stopped

    # Hardening: nothing in here needs root rights, kernel capabilities or a
    # writable file system. nginx only writes its pid and temp files to /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Rotate what is still logged (startup, errors) instead of growing forever.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  web:
    external: true
