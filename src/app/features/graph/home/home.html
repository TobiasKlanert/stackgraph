<section>
  <h1>StackGraph</h1>
  <p>Paste a <code>docker-compose.yml</code> to see it as an interactive graph.</p>

  <label for="compose-input">Docker Compose YAML</label>
  <textarea
    id="compose-input"
    [value]="state.source()"
    (input)="onInput($event)"
    spellcheck="false"
    rows="16"
  ></textarea>
  <app-status-panel [status]="state.state()" />

  <button type="button" (click)="onTryIt()" data-testid="try-it">Try it with an example</button>
  <button type="button" [disabled]="!canOpen()" (click)="onSubmit()" data-testid="show-graph">
    Show graph
  </button>
</section>
