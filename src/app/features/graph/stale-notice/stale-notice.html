@if (stale()) {
  <p class="note">
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      aria-hidden="true"
      focusable="false"
    >
      <circle cx="12" cy="12" r="10" />
      <path d="M12 8v4M12 16h.01" />
    </svg>
    <span>
      <strong>Error in the compose file.</strong>
      The graph shows the last valid version.
    </span>
    <button type="button" class="sg-button" (click)="showInEditor.emit()">Show in editor</button>
  </p>
}
