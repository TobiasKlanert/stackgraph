<!-- Header and footer sit outside the view switch, so they survive it and keyboard focus on the brand is not lost. -->
<app-site-header>
  @if (graphView()) {
    <button
      type="button"
      class="sg-button sg-button--primary"
      data-testid="export-svg"
      (click)="onExport()"
    >
      <svg
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M12 15V3M7 10l5 5 5-5M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
      </svg>
      Export SVG
    </button>
  } @else {
    <nav aria-label="Main">
      <a class="sg-header-link" routerLink="/about">About</a>
    </nav>
  }
  <app-theme-toggle />
</app-site-header>

<main class="main">
  @if (graphView(); as view) {
    <app-editor />
    <app-status-panel [status]="state.state()" />
    <app-rendering
      [graph]="view.graph"
      [selectedId]="selectedId()"
      (nodeSelected)="onNodeSelected($event)"
    />
    @if (selectedService(); as service) {
      <app-detail-panel [service]="service" />
    }
  } @else {
    <app-home (submitted)="openGraph()" />
  }
</main>

<app-site-footer [tagline]="footerText()" />
