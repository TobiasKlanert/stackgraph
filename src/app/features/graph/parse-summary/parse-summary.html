<!-- The live region only holds the result, which changes rarely. The timing
     changes with nearly every parse and would be announced each time. -->
<span class="result" role="status">
  @if (updating()) {
    <!-- The graph stays fully visible meanwhile: no dimming (A11y review #10). -->
    <span class="spinner" aria-hidden="true"></span>
    <span class="label">Updating…</span>
  } @else {
    @switch (status().status) {
      @case ('ready') {
        <svg
          class="icon valid"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M20 6 9 17l-5-5" />
        </svg>
        <span class="label">Valid YAML</span>
      }
      @case ('error') {
        <svg
          class="icon invalid"
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
        <span class="label error">{{ errorLabel() }}</span>
        <span> · The graph shows the last valid version</span>
      }
    }
  }
</span>
@if (duration()) {
  <span class="timing"> · parsed in {{ duration() }}</span>
}
