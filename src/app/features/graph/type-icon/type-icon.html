@switch (kind()) {
  @case ('service') {
    <svg width="10" height="8" viewBox="0 0 10 8" focusable="false">
      <rect x="0.75" y="0.75" width="8.5" height="6.5" rx="1.5" />
    </svg>
  }
  @case ('network') {
    <svg width="11" height="10" viewBox="0 0 11 10" focusable="false">
      <polygon points="0.5,5 3,0.7 8,0.7 10.5,5 8,9.3 3,9.3" />
    </svg>
  }
  @case ('volume') {
    <svg width="10" height="12" viewBox="0 0 10 12" focusable="false">
      <path d="M0.6 2.4 A4.4 1.8 0 0 1 9.4 2.4 V9.6 A4.4 1.8 0 0 1 0.6 9.6 Z" />
    </svg>
  }
  @case ('bind') {
    <svg width="12" height="10" viewBox="0 0 12 10" focusable="false">
      <path
        d="M0.6 1.6 A1 1 0 0 1 1.6 0.6 H4.4 L5.6 1.9 H10.4 A1 1 0 0 1 11.4 2.9 V8.4 A1 1 0 0 1 10.4 9.4 H1.6 A1 1 0 0 1 0.6 8.4 Z"
      />
    </svg>
  }
}
