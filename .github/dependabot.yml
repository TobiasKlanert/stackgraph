version: 2
updates:
  # Keeps the actions in .github/workflows up to date. Dependabot updates the
  # pinned commit hashes together with their version comments.
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/Berlin'
    # Wait a week after a release. A hijacked release is usually noticed and
    # pulled within days, before it would end up here.
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: 'scope'

    groups:
      # Always update Angular packages together
      angular:
        applies-to: version-updates
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@schematics/angular'
      angular-security:
        applies-to: security-updates
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@schematics/angular'
      # Dev tools have been bundled
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

    ignore:
      # Manually trigger Angular major updates using `ng update` (runs migrations)
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-devkit/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@schematics/angular'
        update-types: ['version-update:semver-major']
      # Angular supports only certain versions of TypeScript; `ng update` automatically updates TypeScript accordingly
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: "angular-eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-eslint/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
