server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Caddy terminates TLS in front of this container. Relative redirects keep
    # nginx from sending visitors to http://...:8080.
    absolute_redirect off;

    # Don't advertise the nginx version in headers and error pages.
    server_tokens off;

    # No access log: it would store every visitor's IP (forwarded by Caddy).
    # A static SPA gains little from it, and the privacy policy can say so.
    access_log off;

    # 1. SPA-Fallback: Redirect unknown paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Icons keep their names across builds (no hash in the file name), so
    #    browsers revalidate them; under the rule below a new icon would stay
    #    unseen for a year. Regex locations match in order, so this one first.
    location ~ ^/(?:favicon\.(?:ico|svg)|apple-touch-icon\.png)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 3. Caching Hashed Assets for Long-Term Use
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}