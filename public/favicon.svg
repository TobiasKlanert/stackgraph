<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- StackGraph mark: three stacked services, each linked to the next from
       its end, so the route draws an S. Source of favicon.ico and
       apple-touch-icon.png; the header draws the same shapes inline. -->
  <style>
    .node { fill: #0f766e; }
    .edge { fill: none; stroke: #59616e; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .node { fill: #2dd4bf; }
      .edge { stroke: #8b95a7; }
    }
  </style>
  <path class="edge" d="M12 6H10a2.5 2.5 0 0 0-2.5 2.5V13M20 16h2a2.5 2.5 0 0 1 2.5 2.5V23" />
  <rect class="node" x="12" y="3" width="17" height="6" rx="2" />
  <rect class="node" x="3" y="13" width="17" height="6" rx="2" />
  <rect class="node" x="12" y="23" width="17" height="6" rx="2" />
</svg>
